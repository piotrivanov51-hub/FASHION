name: Build Fashion Studio AI PRO APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Test & Build Installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (API 35)
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Product DNA Lock & AI Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble Installable Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK for download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FashionStudioAIPro-debug.apk
          ls -lh dist/FashionStudioAIPro-debug.apk

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FashionStudioAIPro-APK
          path: dist/FashionStudioAIPro-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (on v* tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FashionStudioAIPro-debug.apk
          generate_release_notes: true
